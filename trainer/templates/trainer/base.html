{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Тренажёр слов — Грузинский с нуля{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=PT+Sans:wght@400;700&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐐</text></svg>">
<link rel="stylesheet" href="{% static 'trainer/css/trainer.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% csrf_token %}
<nav class="topnav">
  <div class="wrap topnav-inner">
    <a class="topnav-brand" href="{% url 'home' %}">🐐 <span>Тренажёр слов</span></a>
    <div class="topnav-links">
      <a href="{% url 'sentence_game' %}">Предложения</a>
      <a href="{% url 'pairs_game' %}">Пары</a>
      <a href="{% url 'flashcard_game' %}">Карточки</a>
      <a href="{% url 'letters_game' %}">Буквы</a>
    </div>
  </div>
</nav>

<main class="wrap page">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">Часть курса «Грузинский с нуля» 🐐</div>
</footer>
<script>
  // shared CSRF helper for POST requests
  function getCookie(name) {
    const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? m.pop() : '';
  }
  window.CSRF_TOKEN = getCookie('csrftoken');
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
